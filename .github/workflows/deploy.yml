# Setiap push ke branch main: cek dulu (sintaks, kamus bahasa, uji asap di mode coba), baru isi folder web/
# di-deploy ke GitHub Pages. Kalau pengecekan gagal, deploy dibatalkan dan versi lama tetap dipakai pengguna.
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kalau ada beberapa push beruntun, yang terakhir saja yang di-deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Salah ketik di JavaScript langsung ketahuan (termasuk kode bot, yang juga JavaScript).
      - name: Cek sintaks
        run: |
          for f in web/assets/*.js web/sw.js .github/*.js; do node --check "$f" || exit 1; done
          cp bot/Kode.gs /tmp/Kode.js && node --check /tmp/Kode.js
      - name: Cek kamus bahasa
        run: node .github/cek-bahasa.js
      - name: Siapkan browser uji
        run: npm i --no-save --no-package-lock playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Uji asap (mode coba, semua tab & dialog utama)
        run: node .github/uji-asap.js

  deploy:
    needs: cek
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # seluruh riwayat, untuk menghitung jumlah commit
      # Penanda versi "1.<jumlah commit>" (tampil sebagai v1.66 di menu Lainnya). Aplikasi yang sudah
      # terpasang di HP membandingkan ini untuk memuat ulang otomatis.
      - run: echo "1.$(git rev-list --count HEAD)" > web/versi.txt
      # Log update "Apa yang baru" di aplikasi (Lainnya), diambil dari judul pesan commit.
      - run: node .github/changelog.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
