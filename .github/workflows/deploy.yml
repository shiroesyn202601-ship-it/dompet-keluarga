# Setiap push ke branch main, isi folder web/ langsung di-deploy ke GitHub Pages.
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kalau ada beberapa push beruntun, yang terakhir saja yang di-deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # seluruh riwayat, untuk menghitung jumlah commit
      # Penanda versi "1.<jumlah commit>" (tampil sebagai v1.66 di menu Lainnya). Aplikasi yang sudah
      # terpasang di HP membandingkan ini untuk memuat ulang otomatis.
      - run: echo "1.$(git rev-list --count HEAD)" > web/versi.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
