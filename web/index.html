<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <!-- Lapisan cadangan terhadap XSS: skrip hanya dari situs ini & Google. Kalau isi skrip tema di bawah diubah,
         perbarui hash sha256-nya (lihat docs/PEMILIK.md → Mengembangkan). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
      script-src 'self' 'sha256-sZtq8vXQrYJTKII27wSEOr4FVrgXUtl1KyW2w2p0Rfk=' https://accounts.google.com https://apis.google.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://apis.google.com https://www.gstatic.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.googleapis.com https://accounts.google.com https://apis.google.com;
      frame-src https://accounts.google.com https://docs.google.com https://drive.google.com https://apis.google.com https://*.googleapis.com;
      object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
    <title>Dompet Keluarga</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="ikon/favicon-32.png">
    <link rel="apple-touch-icon" href="ikon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dompet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <script>
      // Tema & mode samar dipasang sebelum CSS dimuat supaya layar tidak berkedip (lihat aturTema di app.js).
      try {
        var t = localStorage.getItem('dk_tema');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) { /* mode privat */ }
    </script>
    <link rel="stylesheet" href="assets/styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main id="view">
      <div class="memuat-awal"><div class="spinner"></div><p>Memuat…</p></div>
    </main>

    <nav class="bottomnav" id="nav" hidden>
      <button data-aksi="tab" data-tab="beranda">
        <svg class="ik" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>Beranda</button>
      <button data-aksi="tab" data-tab="riwayat">
        <svg class="ik" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Riwayat</button>
      <button class="fab" data-aksi="tambah-trx" aria-label="Catat transaksi">
        <svg class="ik" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button data-aksi="tab" data-tab="dompet">
        <svg class="ik" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>Dompet</button>
      <button data-aksi="tab" data-tab="laporan">
        <svg class="ik" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg>Laporan</button>
    </nav>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-bg" data-aksi="tutup-sheet"></div>
      <div class="sheet-panel" role="dialog" aria-modal="true">
        <div class="grabber"></div>
        <div class="sheet-head">
          <h2 id="sheet-judul"></h2>
          <button class="tombol-ikon" data-aksi="tutup-sheet" aria-label="Tutup">
            <svg class="ik" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div id="sheet-isi"></div>
      </div>
    </div>

    <div id="antrian" class="antrian" aria-live="polite" hidden></div>
    <input type="file" id="input-struk" accept="image/*" hidden>
    <input type="file" id="input-struk-kamera" accept="image/*" capture="environment" hidden>
    <div id="loading" class="loading" hidden><div class="spinner"></div></div>
    <div id="sesi" class="sesi" role="alertdialog" aria-modal="true" aria-labelledby="sesi-judul" hidden></div>
    <div id="kunci" class="kunci" role="dialog" aria-modal="true" aria-label="Aplikasi terkunci" hidden></div>
    <div id="tanya" class="sesi tanya" role="alertdialog" aria-modal="true" aria-labelledby="tanya-pesan" hidden></div>
    <div id="toast" class="toast" hidden></div>

    <script src="assets/config.js"></script>
    <script src="assets/google.js"></script>
    <script src="assets/struk.js"></script>
    <script src="assets/db.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
