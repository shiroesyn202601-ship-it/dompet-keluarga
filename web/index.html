<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>Dompet Keluarga</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👛</text></svg>">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main id="view">
      <div class="memuat-awal"><div class="spinner"></div><p>Memuat…</p></div>
    </main>

    <nav class="bottomnav" id="nav" hidden>
      <button data-aksi="tab" data-tab="beranda"><span>🏠</span>Beranda</button>
      <button data-aksi="tab" data-tab="riwayat"><span>📋</span>Riwayat</button>
      <button class="fab" data-aksi="tambah-trx" aria-label="Catat transaksi">＋</button>
      <button data-aksi="tab" data-tab="dompet"><span>👛</span>Dompet</button>
      <button data-aksi="tab" data-tab="laporan"><span>📊</span>Laporan</button>
    </nav>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-bg" data-aksi="tutup-sheet"></div>
      <div class="sheet-panel" role="dialog" aria-modal="true">
        <div class="sheet-head">
          <h2 id="sheet-judul"></h2>
          <button class="tombol-ikon" data-aksi="tutup-sheet" aria-label="Tutup">✕</button>
        </div>
        <div id="sheet-isi"></div>
      </div>
    </div>

    <input type="file" id="input-struk" accept="image/*" hidden>
    <div id="loading" class="loading" hidden><div class="spinner"></div></div>
    <div id="toast" class="toast" hidden></div>

    <script src="assets/config.js"></script>
    <script src="assets/google.js"></script>
    <script src="assets/struk.js"></script>
    <script src="assets/db.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
