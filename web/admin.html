<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
      script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://www.gstatic.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.googleapis.com https://accounts.google.com https://script.google.com https://script.googleusercontent.com;
      frame-src https://accounts.google.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
    <title>Admin Lisensi</title>
    <link rel="icon" href="ikon/favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <style>
      /* ======================================================================
         Admin Lisensi — gaya sama dengan aplikasi Dompet Keluarga (web/assets/styles.css):
         latar lembut, kartu besar membulat, kartu "hero" hijau tua, navigasi pil mengambang.
         Dua tampilan: .mode-web (sidebar + isi lebar) dan .mode-mobile (satu kolom + navigasi bawah).
         ====================================================================== */
      :root {
        --bg: #f4f5f8; --card: #ffffff; --card-2: #f1f2f6; --text: #0c111d; --muted: #667085; --line: #e8eaef;
        --primary: #0e7c86; --primary-soft: #e2f4f5; --on-primary: #ffffff; --on-status: #ffffff;
        --ok: #079455; --ok-bg: #e3f6ec; --warn: #b54708; --warn-bg: #fef0e1; --bad: #d63c2f; --bad-bg: #fdeceb; --info: #475467; --info-bg: #eef0f3;
        --hero-1: #062a2e; --hero-2: #0b4f55;
        --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 16px rgba(16, 24, 40, .05); --shadow-up: 0 10px 30px rgba(16, 24, 40, .14);
        --radius: 22px; --radius-sm: 14px; --nav-h: 66px; --samping: 248px;
        color-scheme: light;
      }
      /* Tema gelap: mengikuti perangkat, kecuali dipilih sendiri lewat tombol ☀/☾ (data-theme di <html>, lihat admin-awal.js). */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0c10; --card: #15171d; --card-2: #1d2028; --text: #f2f4f7; --muted: #98a2b3; --line: #252833;
          --primary: #4cc9d1; --primary-soft: #0f2e31; --on-primary: #04211f; --on-status: #0b0c10;
          --ok: #3ccb8b; --ok-bg: #0f2a1e; --warn: #ffb35c; --warn-bg: #33240f; --bad: #ff8a7a; --bad-bg: #3b1715; --info: #c3c8d1; --info-bg: #23272f;
          --hero-1: #082b2e; --hero-2: #0e4c52; --shadow: none; --shadow-up: 0 10px 30px rgba(0, 0, 0, .5);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
          --bg: #0b0c10; --card: #15171d; --card-2: #1d2028; --text: #f2f4f7; --muted: #98a2b3; --line: #252833;
          --primary: #4cc9d1; --primary-soft: #0f2e31; --on-primary: #04211f; --on-status: #0b0c10;
          --ok: #3ccb8b; --ok-bg: #0f2a1e; --warn: #ffb35c; --warn-bg: #33240f; --bad: #ff8a7a; --bad-bg: #3b1715; --info: #c3c8d1; --info-bg: #23272f;
          --hero-1: #082b2e; --hero-2: #0e4c52; --shadow: none; --shadow-up: 0 10px 30px rgba(0, 0, 0, .5);
          color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      body { font: 15px/1.45 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
      button, input, textarea, select { font: inherit; color: inherit; }
      button { cursor: pointer; border: 0; background: none; padding: 0; }
      button:disabled { cursor: default; }
      button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      a { color: var(--primary); }
      h1, h2, h3 { margin: 0; letter-spacing: -.01em; }
      svg.ik { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      .angka { font-variant-numeric: tabular-nums; }

      /* ---------- Tombol ---------- */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; padding: 11px 18px; font-weight: 700; font-size: 14.5px;
        transition: transform .1s, background .15s, opacity .15s; white-space: nowrap; }
      .btn:active:not(:disabled) { transform: scale(.97); }
      .btn:disabled { opacity: .6; }
      .btn-utama { background: var(--primary); color: var(--on-primary); }
      .btn-kedua { background: var(--card-2); color: var(--text); }
      .btn-hijau { background: var(--ok); color: var(--on-status); }
      .btn-merah { background: var(--bad); color: var(--on-status); }
      .btn-lembut-merah { background: var(--bad-bg); color: var(--bad); }
      .btn-garis { border: 1px solid var(--line); background: var(--card); }
      .btn.kecil { padding: 8px 13px; font-size: 13.5px; border-radius: 12px; }
      .ikon-btn { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; color: var(--text); background: var(--card);
        border: 1px solid var(--line); flex: none; }
      .ikon-btn:hover { background: var(--card-2); }
      .ikon-btn svg.ik { width: 20px; height: 20px; }
      /* Penanda memuat: lingkaran berputar di tombol mana pun yang sedang bekerja */
      .putar { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; display: inline-block; flex: none;
        animation: putar .7s linear infinite; }
      .ikon-btn.memuat svg.ik { animation: putar .8s linear infinite; }
      @keyframes putar { to { transform: rotate(360deg); } }

      /* Garis progres di paling atas selama ada permintaan ke bot */
      .progres { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 40; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .2s; }
      .progres::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--primary); border-radius: 0 3px 3px 0;
        animation: progres 1.1s ease-in-out infinite; }
      body.sibuk .progres { opacity: 1; }
      @keyframes progres { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

      /* ---------- Kerangka aplikasi ---------- */
      .app[hidden] { display: none; }
      .samping { display: none; }
      .navbawah { display: none; }
      .utama { min-width: 0; }
      main#isi { padding: 0 16px 40px; }

      /* Mode web: sidebar tetap + isi lebar */
      .mode-web .app { display: grid; grid-template-columns: var(--samping) 1fr; min-height: 100vh; }
      .mode-web .samping { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 20px 14px;
        background: var(--card); border-right: 1px solid var(--line); }
      .mode-web .utama { max-width: 1240px; width: 100%; margin: 0 auto; }
      .mode-web main#isi { padding: 0 28px 48px; }
      .mode-web .kepala { padding: 24px 28px 18px; }
      @media (max-width: 760px) { .mode-web { --samping: 76px; } .mode-web .samping .teks, .mode-web .samping .merek div, .mode-web .samping .lencana { display: none; }
        .mode-web .samping .nav-item { justify-content: center; padding: 12px 0; } .mode-web main#isi { padding: 0 16px 40px; } .mode-web .kepala { padding: 18px 16px 14px; } }

      /* Mode mobile: satu kolom seperti aplikasi, navigasi pil di bawah */
      .mode-mobile .utama { max-width: 520px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + 36px + env(safe-area-inset-bottom)); }
      .mode-mobile .navbawah { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 50%; transform: translateX(-50%); z-index: 15;
        bottom: calc(12px + env(safe-area-inset-bottom)); width: calc(100% - 24px); max-width: 496px; height: var(--nav-h);
        background: color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
        border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow-up); }
      .navbawah button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
      .navbawah svg.ik { box-sizing: content-box; padding: 4px 16px; border-radius: 99px; transition: background .2s; }
      .navbawah button.aktif { color: var(--primary); font-weight: 700; }
      .navbawah button.aktif svg.ik { background: var(--primary-soft); }
      .navbawah .lencana { position: absolute; top: 6px; left: calc(50% + 8px); }

      /* Sidebar (mode web) */
      .merek { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
      .merek img { width: 40px; height: 40px; flex: none; }
      .merek b { display: block; font-size: 16px; font-weight: 800; line-height: 1.2; } .merek small { display: block; color: var(--muted); font-size: 12px; }
      .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; font-weight: 600; color: var(--muted); text-decoration: none; width: 100%; text-align: left; }
      .nav-item:hover { background: var(--card-2); color: var(--text); }
      .nav-item.aktif { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
      .nav-item .teks { flex: 1; }
      .samping .bawah { margin-top: auto; display: grid; gap: 10px; }
      .lencana { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--warn); color: #fff; font-size: 11.5px; font-weight: 800;
        display: inline-grid; place-items: center; line-height: 1; color: var(--on-status); }

      /* Pemilih tampilan Web / Mobile */
      .baris-tampilan { display: flex; gap: 8px; align-items: stretch; }
      .baris-tampilan .pilih-mode { flex: 1; }
      .tombol-tema { width: auto; height: auto; min-width: 44px; border-radius: 14px; background: var(--card-2); border: 0; color: var(--text); }
      .tombol-tema:hover { background: var(--line); }
      @media (max-width: 760px) { .mode-web .samping .baris-tampilan { flex-direction: column; } .mode-web .samping .tombol-tema { min-height: 40px; } }
      .pilih-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--card-2); border-radius: 14px; }
      .pilih-mode button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; border-radius: 11px; font-size: 13px; font-weight: 700; color: var(--muted); }
      .pilih-mode button svg.ik { width: 18px; height: 18px; }
      .pilih-mode button.aktif { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
      @media (max-width: 760px) { .mode-web .samping .pilih-mode { grid-template-columns: 1fr; } .mode-web .samping .pilih-mode .teks { display: none; } }
      .kartu-akun { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--card-2); min-width: 0; }
      .kartu-akun .isi { flex: 1; min-width: 0; } .kartu-akun b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .kartu-akun small { color: var(--muted); font-size: 11.5px; }
      .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--hero-2)); color: #fff; display: grid; place-items: center;
        font-weight: 800; flex: none; }
      @media (max-width: 760px) { .mode-web .kartu-akun { justify-content: center; padding: 6px; } .mode-web .kartu-akun .isi, .mode-web .kartu-akun .ikon-btn { display: none; } }

      /* ---------- Kepala halaman ---------- */
      .kepala { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 14px; position: sticky; top: 0; z-index: 8;
        background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
      .kepala .judul { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .kepala .judul img { width: 38px; height: 38px; flex: none; }
      .mode-web .kepala .judul img { display: none; }
      .kepala small { display: block; color: var(--muted); font-size: 13px; }
      .kepala h1 { font-size: 22px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kepala-kanan { display: flex; align-items: center; gap: 8px; flex: none; }

      /* ---------- Hero & ringkasan ---------- */
      .baris-atas { display: grid; gap: 14px; margin-bottom: 18px; }
      .mode-web .baris-atas { grid-template-columns: minmax(300px, 1.3fr) 2fr; }
      .hero { position: relative; overflow: hidden; border-radius: var(--radius); padding: 20px; color: #fff;
        background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--hero-2) 70%, #1aa3ad) 0%, var(--hero-2) 38%, var(--hero-1) 100%); box-shadow: var(--shadow-up); }
      .hero::after { content: ''; position: absolute; right: -40px; bottom: -60px; width: 220px; height: 220px; border-radius: 50%; border: 28px solid rgba(255, 255, 255, .05); }
      .hero small { opacity: .75; font-size: 13px; font-weight: 600; }
      .hero .besar { display: block; font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0 12px; }
      .hero .chip-hero { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .12); border-radius: 99px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; margin: 0 6px 6px 0; }
      .hero-ringkas { display: grid; gap: 18px; margin-bottom: 18px; }
      .mode-web .hero-ringkas { grid-template-columns: 1fr 1.4fr; align-items: center; padding: 24px 26px; }
      .hero-uang .besar { margin-bottom: 10px; }
      .hero-angka { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .hero-angka > div { background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .1); border-radius: 16px; padding: 10px 12px; min-width: 0; }
      .hero-angka small { display: block; font-size: 11.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hero-angka b { display: block; font-size: 22px; font-weight: 800; line-height: 1.15; }
      .titik-hero { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--warna); margin-bottom: 6px; box-shadow: 0 0 0 3px rgba(255, 255, 255, .08); }
      .mode-mobile .hero-angka { gap: 6px; } .mode-mobile .hero-angka > div { padding: 8px 9px; border-radius: 13px; } .mode-mobile .hero-angka b { font-size: 19px; } .mode-mobile .hero-angka small { font-size: 10.5px; }
      .statistik { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .mode-web .statistik { grid-template-columns: repeat(4, 1fr); }
      .stat { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
        transition: border-color .15s, box-shadow .15s; width: 100%; }
      .stat:hover { border-color: color-mix(in srgb, var(--warna) 50%, var(--line)); }
      .stat.dipilih { border-color: var(--warna); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warna) 18%, transparent); }
      .stat .ik-bulat { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--warna) 14%, var(--card)); color: var(--warna); }
      .stat .ik-bulat svg.ik { width: 19px; height: 19px; }
      .stat small { color: var(--muted); font-size: 12.5px; font-weight: 600; }
      .stat b { font-size: 24px; font-weight: 800; line-height: 1; }

      /* ---------- Filter & cari ---------- */
      .alat { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
      .chip-filter { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; padding: 2px; }
      .chip-filter::-webkit-scrollbar { display: none; }
      .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600;
        white-space: nowrap; color: var(--muted); }
      .chip i { font-style: normal; background: var(--card-2); border-radius: 99px; padding: 0 7px; font-size: 12px; color: var(--text); }
      .chip.aktif { background: var(--text); color: var(--bg); border-color: var(--text); }
      .chip.aktif i { background: color-mix(in srgb, var(--bg) 22%, transparent); color: var(--bg); }
      .cari { position: relative; flex: 1 1 260px; max-width: 100%; }
      .mode-mobile .cari { flex-basis: 100%; }
      .cari input { width: 100%; padding: 11px 14px 11px 40px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); outline: none; }
      .cari input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
      .cari svg.ik { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }

      /* ---------- Kartu pengajuan ---------- */
      .daftar { display: grid; gap: 12px; }
      .mode-web .daftar { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
      .kartu { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: grid;
        grid-template-columns: 92px 1fr; gap: 14px; animation: naik .2s ease-out both; }
      .mode-web .kartu { grid-template-columns: 112px 1fr; padding: 16px; }
      .bukti { width: 100%; aspect-ratio: 3 / 4; border-radius: 14px; background: var(--card-2); border: 1px dashed var(--line); display: grid; place-items: center; align-content: center; gap: 6px;
        color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; padding: 6px; overflow: hidden; }
      .bukti svg.ik { width: 22px; height: 22px; }
      button.bukti:hover { border-color: var(--primary); color: var(--primary); }
      .bukti.ada { border-style: solid; padding: 0; cursor: zoom-in; }
      .bukti img { width: 100%; height: 100%; object-fit: cover; }
      .bukti.memuat { background: linear-gradient(90deg, var(--card-2) 25%, var(--line) 50%, var(--card-2) 75%); background-size: 200% 100%; animation: kilau 1.2s infinite; border-style: solid; }
      .kartu .isi { min-width: 0; display: flex; flex-direction: column; }
      .kartu .atas { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
      .kartu .email { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mode-mobile .kartu { grid-template-columns: 72px 1fr; gap: 12px; }
      .mode-mobile .kartu .atas { flex-direction: column-reverse; align-items: flex-start; gap: 6px; }
      .mode-mobile .kartu .atas > div { width: 100%; }
      .mode-mobile .aksi .ke-kanan { margin-left: 0; }
      .kartu .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
      .status { font-size: 11.5px; font-weight: 800; border-radius: 99px; padding: 4px 10px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; flex: none; }
      .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .status.menunggu { background: var(--warn-bg); color: var(--warn); }
      .status.aktif { background: var(--ok-bg); color: var(--ok); }
      .status.ditolak { background: var(--bad-bg); color: var(--bad); }
      .status.nonaktif { background: var(--info-bg); color: var(--info); }
      .harga-aju { margin-top: 10px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
      .harga-aju b { font-size: 18px; font-weight: 800; } .harga-aju small { color: var(--muted); font-size: 12px; }
      .kode { margin-top: 8px; display: flex; align-items: center; gap: 6px; font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted);
        background: var(--card-2); border-radius: 10px; padding: 6px 6px 6px 10px; min-width: 0; }
      .kode span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .kode button { padding: 3px 8px; border-radius: 8px; font: 700 12px/1.3 "Plus Jakarta Sans", system-ui, sans-serif; color: var(--primary); }
      .kode button:hover { background: var(--card); }
      .alasan { margin-top: 8px; font-size: 13px; background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 8px 10px; }
      .aksi { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; align-items: center; }
      .aksi .ke-kanan { margin-left: auto; }

      /* Kerangka saat memuat */
      .kerangka { background: linear-gradient(90deg, var(--card) 25%, var(--card-2) 50%, var(--card) 75%); background-size: 200% 100%; animation: kilau 1.2s infinite;
        border: 1px solid var(--line); border-radius: var(--radius); }
      @keyframes kilau { to { background-position: -200% 0; } }

      /* Masukan pengguna */
      .mode-web .daftar-masukan { grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); align-items: start; }
      .kartu.kartu-masukan, .mode-web .kartu.kartu-masukan, .mode-mobile .kartu.kartu-masukan { display: block; }
      .kartu-masukan.baru { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
